# curso-hfc.metadatape.com — Panel HFC (demo del curso). DEPLOY-PLAN §3. Copiar a /etc/nginx/sites-available/
# y enlazar en sites-enabled; luego `certbot --nginx -d curso-hfc.metadatape.com` agrega el bloque 443.
# Solo se publica web/ (nunca la raíz del repo: .git, sql/, .env quedan fuera del alcance de Nginx).
limit_req_zone $binary_remote_addr zone=curso_hfc_login:1m rate=10r/m;

server {
    server_name curso-hfc.metadatape.com;
    listen 80;

    root /opt/curso-hfc/web;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;

    # Cabeceras de seguridad (SECURITY-REPORT SP-07). 'unsafe-inline' en script-src es necesario por los
    # onclick del HTML heredado: riesgo aceptado y mitigado con limpiarTextos() (SP-08).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Límite de intentos por IP en Nginx, además del límite por usuario+IP de la API (SP-05).
    location = /api/hfc-login {
        limit_req zone=curso_hfc_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
